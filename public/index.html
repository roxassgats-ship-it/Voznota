<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Descarga videos de YouTube gratis, con audio, y reproduce sin conexión" />
  <title>Voznota</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="13" stroke="#e63946" stroke-width="2"/>
          <polygon points="11,9 21,14 11,19" fill="#e63946"/>
        </svg>
        <span>Voznota</span>
      </div>
      <button id="install-btn" class="btn-install hidden" aria-label="Instalar app">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Instalar
      </button>
    </header>

    <!-- Tab bar -->
    <nav class="tab-bar" role="tablist">
      <button class="tab active" data-tab="downloader" role="tab" aria-selected="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Descargar
      </button>
      <button class="tab" data-tab="library" role="tab" aria-selected="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Biblioteca
      </button>
    </nav>

    <!-- Downloader View -->
    <main id="view-downloader" class="view active" role="tabpanel">

      <!-- URL Input -->
      <section class="url-section">
        <div class="url-input-row">
          <input
            id="url-input"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="Pega el link de YouTube aquí"
            aria-label="URL de YouTube"
          />
          <button id="paste-btn" class="btn-icon" aria-label="Pegar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          </button>
          <button id="fetch-btn" class="btn-primary" aria-label="Buscar video">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div id="fetch-error" class="error-msg hidden" role="alert"></div>
      </section>

      <!-- Video Info Card -->
      <section id="video-card" class="video-card hidden">
        <div class="video-thumb-wrapper">
          <img id="video-thumb" src="" alt="Miniatura del video" loading="lazy" />
          <span id="video-duration" class="duration-badge"></span>
        </div>
        <div class="video-meta">
          <p id="video-title" class="video-title"></p>
          <p id="video-channel" class="video-channel"></p>
        </div>
      </section>

      <!-- Options Panel -->
      <section id="options-panel" class="options-panel hidden">
        <!-- Media type toggle -->
        <div class="option-group">
          <label class="option-label">Tipo</label>
          <div class="toggle-group" role="group" aria-label="Tipo de medio">
            <button class="toggle-btn active" data-type="video">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              Video
            </button>
            <button class="toggle-btn" data-type="audio">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              Audio
            </button>
          </div>
        </div>

        <!-- Quality chips (video only) -->
        <div id="quality-group" class="option-group">
          <label class="option-label">Calidad</label>
          <div class="chips" id="quality-chips" role="group" aria-label="Calidad de video"></div>
        </div>

        <!-- Format selector -->
        <div class="option-group">
          <label class="option-label" for="format-select">Formato</label>
          <select id="format-select" class="select-input" aria-label="Formato de salida"></select>
        </div>

        <button id="download-btn" class="btn-download">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Descargar
        </button>
      </section>

      <!-- Active Downloads Queue -->
      <section id="queue-section" class="queue-section">
        <div id="queue-list"></div>
      </section>
    </main>

    <!-- Library View -->
    <main id="view-library" class="view hidden" role="tabpanel">
      <div id="library-empty" class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.5"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        <p>No hay descargas aún</p>
        <small>Tus videos descargados aparecerán aquí</small>
      </div>
      <div id="library-list"></div>
    </main>

    <!-- In-App Player -->
    <div id="player-overlay" class="player-overlay hidden" role="dialog" aria-modal="true" aria-label="Reproductor">
      <div class="player-container">
        <div class="player-header">
          <button id="player-close" class="btn-icon" aria-label="Cerrar reproductor">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <span id="player-title" class="player-title-text"></span>
        </div>

        <video id="player-video" class="player-video" controls controlsList="nodownload" playsinline preload="metadata"></video>
        <audio id="player-audio" class="player-audio" controls preload="metadata" hidden></audio>

        <div class="player-controls">
          <div class="player-speed">
            <label for="speed-select" class="option-label">Velocidad</label>
            <select id="speed-select" class="select-input small">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </div>
          <a id="player-download-link" class="btn-secondary" download>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Guardar archivo
          </a>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/library.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
