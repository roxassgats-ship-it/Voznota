<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voznota — notas con voz</title>
<style>
  :root{ --papel:#F4F6F3; --tinta:#1E2A27; --tenue:#5C6B66; --linea:#D8DFDA;
    --tarjeta:#FFFFFF; --acento:#17606B; --acento-suave:#E3EEEF; --ok:#3E7A46; --grabando:#A2402F; }
  @media (prefers-color-scheme: dark){
    :root{ --papel:#131D1B; --tinta:#E3ECE8; --tenue:#93A59F; --linea:#2A3B37;
      --tarjeta:#1B2926; --acento:#5FB0AC; --acento-suave:#1E3335; --ok:#7CBA84; --grabando:#D4776A; }
  }
  body{ margin:0; background:var(--papel); color:var(--tinta);
    font:16px/1.5 ui-sans-serif, system-ui, sans-serif; padding:24px 16px 80px; }
  .marco{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  h1{ font-family:Georgia, serif; font-size:1.5rem; margin:0; }
  .sub{ color:var(--tenue); font-size:.85rem; }
  #grabar{ font-size:1rem; font-weight:600; padding:14px 22px; border-radius:99px;
    border:none; background:var(--acento); color:#fff; cursor:pointer; }
  #grabar.activo{ background:var(--grabando); }
  #grabar:focus-visible, .tarea input:focus-visible, #buscar:focus-visible{ outline:3px solid var(--acento); outline-offset:2px; }
  #estado{ font-size:.85rem; color:var(--tenue); min-height:1.2em; }
  #manual{ width:100%; box-sizing:border-box; padding:10px; border-radius:8px;
    border:1px solid var(--linea); background:var(--tarjeta); color:var(--tinta); font:inherit; min-height:64px; }
  #buscar{ width:100%; box-sizing:border-box; padding:10px; border-radius:8px;
    border:1px solid var(--linea); background:var(--tarjeta); color:var(--tinta); font:inherit; }
  .nota{ background:var(--tarjeta); border:1px solid var(--linea); border-radius:10px; padding:14px 16px; }
  .nota h2{ font-size:1rem; margin:0 0 4px; }
  .nota .fecha{ font-size:.75rem; color:var(--tenue); }
  .nota p{ margin:8px 0; font-size:.92rem; }
  .tarea{ display:flex; align-items:center; gap:8px; font-size:.9rem; margin:4px 0; }
  .tarea.hecha span{ text-decoration:line-through; color:var(--tenue); }
  .acciones{ display:flex; gap:10px; margin-top:8px; }
  .acciones button{ font-size:.78rem; border:1px solid var(--linea); background:none;
    color:var(--tenue); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .fila{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .pill{ font-size:.75rem; background:var(--acento-suave); color:var(--acento);
    padding:2px 10px; border-radius:99px; font-weight:600; }
</style>
</head>
<body>
<div class="marco">
  <div>
    <h1>🎙️ Voznota</h1>
    <div class="sub">Hablá y soltá: la nota se transcribe, las tareas se detectan solas. Tus notas quedan en este dispositivo; la transcripción de voz usa el servicio de tu navegador.</div>
  </div>
  <div class="fila">
    <button id="grabar">🎙️ Grabar nota</button>
    <span id="estado" role="status"></span>
  </div>
  <textarea id="manual" placeholder="…o escribí/pegá la nota acá y apretá Enter"></textarea>
  <input id="buscar" type="search" placeholder="Buscar en las notas…" aria-label="Buscar en las notas">
  <div class="fila sub"><span class="pill" id="resumen">0 notas</span><span class="pill" id="pendientes">0 tareas pendientes</span></div>
  <div id="lista" aria-live="polite"></div>
</div>
<script>
(function(){
  var CLAVE = 'voznota.notas.v1';
  var notas = [];
  try { notas = JSON.parse(localStorage.getItem(CLAVE) || '[]'); } catch(e){ notas = []; }

  var VERBOS = /\b(comprar|llamar|enviar|mandar|agendar|pagar|reservar|pedir|revisar|preparar|buscar|anotar|avisar|recordar|hacer)\b/i;

  function extraerTareas(texto){
    return texto.split(/[.,;\n]| y /i)
      .map(function(t){ return t.trim(); })
      .filter(function(t){ return t.length > 3 && VERBOS.test(t); })
      .map(function(t){ return { texto: t, hecha: false }; });
  }
  function titulo(texto){
    return texto.trim().split(/\s+/).slice(0,5).join(' ') || 'Nota sin texto';
  }
  function guardar(){ localStorage.setItem(CLAVE, JSON.stringify(notas)); }

  function agregarNota(texto){
    if (!texto || !texto.trim()) return;
    notas.unshift({ id: Date.now(), titulo: titulo(texto), transcripcion: texto.trim(),
      creada: new Date().toISOString(), tareas: extraerTareas(texto) });
    guardar(); pintar();
  }

  function pintar(){
    var filtro = (document.getElementById('buscar').value || '').toLowerCase();
    var visibles = notas.filter(function(n){
      return !filtro || (n.titulo + ' ' + n.transcripcion).toLowerCase().indexOf(filtro) >= 0;
    });
    var pend = notas.reduce(function(a,n){ return a + n.tareas.filter(function(t){return !t.hecha;}).length; }, 0);
    document.getElementById('resumen').textContent = notas.length + (notas.length===1?' nota':' notas');
    document.getElementById('pendientes').textContent = pend + (pend===1?' tarea pendiente':' tareas pendientes');
    var cont = document.getElementById('lista');
    cont.innerHTML = '';
    visibles.forEach(function(n){
      var d = document.createElement('div'); d.className = 'nota';
      var f = new Date(n.creada);
      d.innerHTML = '<h2></h2><div class="fecha"></div><p></p>';
      d.querySelector('h2').textContent = n.titulo;
      d.querySelector('.fecha').textContent = f.toLocaleString('es');
      d.querySelector('p').textContent = n.transcripcion;
      n.tareas.forEach(function(t, i){
        var lt = document.createElement('label');
        lt.className = 'tarea' + (t.hecha ? ' hecha' : '');
        var cb = document.createElement('input'); cb.type='checkbox'; cb.checked = t.hecha;
        cb.addEventListener('change', function(){ t.hecha = cb.checked; guardar(); pintar(); });
        var sp = document.createElement('span'); sp.textContent = t.texto;
        lt.appendChild(cb); lt.appendChild(sp); d.appendChild(lt);
      });
      var acc = document.createElement('div'); acc.className='acciones';
      var bb = document.createElement('button'); bb.textContent = 'Borrar nota';
      bb.addEventListener('click', function(){
        if (confirm('¿Borrar "' + n.titulo + '"?')){
          notas = notas.filter(function(x){ return x.id !== n.id; }); guardar(); pintar();
        }
      });
      acc.appendChild(bb); d.appendChild(acc); cont.appendChild(d);
    });
  }

  var boton = document.getElementById('grabar');
  var estado = document.getElementById('estado');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    boton.disabled = true;
    estado.textContent = 'Este navegador no transcribe voz: usá el cuadro de texto de abajo (funciona igual).';
  } else {
    var rec = null, escuchando = false;
    boton.addEventListener('click', function(){
      if (escuchando){ rec.stop(); return; }
      rec = new SR(); rec.lang = 'es-ES'; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onstart = function(){ escuchando = true; boton.classList.add('activo');
        boton.textContent = '⏹️ Parar'; estado.textContent = 'Escuchando…'; };
      rec.onresult = function(ev){
        var texto = Array.prototype.map.call(ev.results, function(r){ return r[0].transcript; }).join(' ');
        agregarNota(texto); estado.textContent = 'Nota guardada.';
      };
      rec.onerror = function(ev){ estado.textContent = 'No se pudo escuchar (' + ev.error + '). Probá con el cuadro de texto.'; };
      rec.onend = function(){ escuchando = false; boton.classList.remove('activo'); boton.textContent = '🎙️ Grabar nota'; };
      rec.start();
    });
  }

  document.getElementById('manual').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.shiftKey){
      ev.preventDefault(); agregarNota(this.value); this.value = '';
      estado.textContent = 'Nota guardada.';
    }
  });
  document.getElementById('buscar').addEventListener('input', pintar);
  pintar();
})();
</script>
</body>
</html>
