<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voznota – TikTok Analyzer</title>
<style>
  :root {
    --bg: #0f0f1a; --card: #1a1a2e; --accent: #e94560;
    --blue: #03b2f8; --text: #e0e0e0; --muted: #888;
    --success: #00d68f; --warn: #ffaa00; --error: #ff4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  header { background: var(--card); padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 22px; color: white; }
  header span { font-size: 13px; color: var(--muted); }
  .live-dot { width: 10px; height: 10px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; margin-left: auto; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .submit-card { background: var(--card); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .submit-card h2 { font-size: 16px; color: var(--blue); margin-bottom: 16px; }
  .input-row { display: flex; gap: 10px; }
  .input-row input { flex: 1; background: #0f0f1a; border: 1px solid #333; border-radius: 10px; padding: 12px 16px; color: white; font-size: 15px; outline: none; transition: border-color .2s; }
  .input-row input:focus { border-color: var(--blue); }
  .btn { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s; white-space: nowrap; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .options { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .options label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .options input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .section-title { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .video-card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; border-left: 4px solid var(--muted); transition: border-color .3s; }
  .video-card.done { border-left-color: var(--success); }
  .video-card.error { border-left-color: var(--error); }
  .video-card.analyzing, .video-card.downloading, .video-card.extracting, .video-card.packaging, .video-card.notifying { border-left-color: var(--blue); }
  .card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .card-title { font-size: 15px; font-weight: 600; flex: 1; }
  .card-author { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; text-transform: uppercase; }
  .status-pending { background: #333; color: var(--muted); }
  .status-downloading, .status-extracting, .status-analyzing, .status-packaging, .status-notifying { background: #0a2a40; color: var(--blue); }
  .status-done { background: #003d27; color: var(--success); }
  .status-error { background: #3d0000; color: var(--error); }
  .progress-steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .step { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #222; color: var(--muted); }
  .step.active { background: var(--blue); color: white; }
  .step.done { background: var(--success); color: white; }
  .summary { font-size: 13px; color: #bbb; line-height: 1.5; margin-bottom: 10px; max-height: 80px; overflow: hidden; position: relative; }
  .summary.expanded { max-height: none; }
  .expand-btn { font-size: 12px; color: var(--blue); cursor: pointer; background: none; border: none; padding: 0; }
  .meta-row { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .meta-row span { display: flex; align-items: center; gap: 4px; }
  .download-btn { margin-top: 10px; font-size: 13px; background: #1e2d40; color: var(--blue); border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
  .download-btn:hover { background: #0a3a5a; }
  .error-msg { font-size: 12px; color: var(--error); background: #1a0000; padding: 8px 12px; border-radius: 8px; margin-top: 8px; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--card); color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; border-left: 4px solid var(--blue); display: none; z-index: 999; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🎵 Voznota</h1>
    <span>TikTok Analyzer con IA</span>
  </div>
  <div class="live-dot" title="En vivo"></div>
</header>

<div class="container">
  <div class="submit-card">
    <h2>➕ Analizar nuevo video</h2>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="Pega el link de TikTok aquí..." />
      <button class="btn" id="submitBtn" onclick="submitUrl()">Analizar</button>
    </div>
    <div class="options">
      <label><input type="checkbox" id="optEmail" checked> 📧 Email</label>
      <label><input type="checkbox" id="optDiscord" checked> 💬 Discord</label>
    </div>
  </div>

  <div class="section-title">Historial de videos</div>
  <div id="videoList"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="icon">🎬</div>
    <p>No hay videos analizados aún.<br>Pega un link de TikTok arriba para comenzar.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STEPS = ['pending','downloading','extracting','analyzing','packaging','notifying','done'];
const STEP_LABELS = {
  pending: '⏳ En cola',
  downloading: '⬇️ Descargando',
  extracting: '🎵 Extrayendo audio',
  analyzing: '🤖 Analizando con Claude',
  packaging: '📦 Empaquetando',
  notifying: '📤 Notificando',
  done: '✅ Listo'
};

function showToast(msg, color='#03b2f8') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = color;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

async function submitUrl() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showToast('Pega un link de TikTok primero', '#ff4444'); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Procesando...';
  const sendEmail = document.getElementById('optEmail').checked;
  const sendDiscord = document.getElementById('optDiscord').checked;
  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url, send_email: sendEmail, send_discord: sendDiscord})
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('urlInput').value = '';
      showToast('Video en cola para análisis ✓');
    } else {
      showToast(data.error || 'Error desconocido', '#ff4444');
    }
  } catch(e) {
    showToast('Error de conexión', '#ff4444');
  }
  btn.disabled = false; btn.textContent = 'Analizar';
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitUrl();
});

function stepClass(step, current) {
  const si = STEPS.indexOf(step);
  const ci = STEPS.indexOf(current);
  if (current === 'done') return 'done';
  if (si < ci) return 'done';
  if (si === ci) return 'active';
  return '';
}

function renderCard(v) {
  const steps = STEPS.slice(0, -1);
  const stepsHtml = steps.map(s => `<span class="step ${stepClass(s, v.status)}">${STEP_LABELS[s]}</span>`).join('');
  const summaryHtml = v.summary
    ? `<div class="summary" id="sum_${v.id}">${v.summary.replace(/\n/g,'<br>')}</div>
       <button class="expand-btn" onclick="toggleSum(${v.id})">Ver más ↓</button>`
    : '';
  const metaHtml = `<div class="meta-row">
    ${v.author ? `<span>👤 @${v.author}</span>` : ''}
    ${v.duration ? `<span>⏱ ${v.duration}s</span>` : ''}
    <span>🕐 ${v.created_at ? v.created_at.slice(0,16).replace('T',' ') : ''}</span>
  </div>`;
  const dlBtn = v.zip_path
    ? `<a class="download-btn" href="/api/download/${v.id}" download>⬇️ Descargar ZIP</a>` : '';
  const errHtml = v.error ? `<div class="error-msg">⚠️ ${v.error}</div>` : '';
  return `
  <div class="video-card ${v.status}" id="card_${v.id}">
    <div class="card-header">
      <div style="flex:1">
        <div class="card-title">${v.title || v.url}</div>
        <div class="card-author">${v.author ? '@' + v.author : ''}</div>
      </div>
      <span class="status-badge status-${v.status}">${STEP_LABELS[v.status] || v.status}</span>
    </div>
    <div class="progress-steps">${stepsHtml}</div>
    ${summaryHtml}
    ${metaHtml}
    ${dlBtn}
    ${errHtml}
  </div>`;
}

function toggleSum(id) {
  const el = document.getElementById('sum_' + id);
  el.classList.toggle('expanded');
}

async function loadVideos() {
  const res = await fetch('/api/videos');
  const videos = await res.json();
  const list = document.getElementById('videoList');
  const empty = document.getElementById('emptyState');
  if (!videos.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = videos.map(renderCard).join('');
}

loadVideos();
setInterval(loadVideos, 3000);
</script>
</body>
</html>
